name: Deploy bookings

# On merge to master (changes to this app, shared packages or the lockfile) or by hand:
# deploy to staging, then to production once the owner approves the 'prd' environment.
on:
  push:
    branches: [master]
    paths:
      - "apps/bookings/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/workflows/deploy-bookings.yml"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stg:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bookings
      key: BOOKINGS
      environment: stg
    secrets: inherit

  prd:
    needs: stg
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bookings
      key: BOOKINGS
      environment: prd
    secrets: inherit
