name: Deploy app

# Reusable workflow (decisions 0009 and 0010): builds one frontend app as static files and uploads
# it to that app's Azure Static Web App in the given GitHub environment ('stg' or 'prd').
# Called by deploy-<app>.yml. The environment supplies the deployment token and the URL variables.
on:
  workflow_call:
    inputs:
      app:
        description: "App folder name under apps/ (hub, hajjandumrah, bookings, studio)"
        required: true
        type: string
      key:
        description: "Upper-case app key used in secret and variable names (HUB, HAJJANDUMRAH, BOOKINGS, STUDIO)"
        required: true
        type: string
      environment:
        description: "GitHub environment: stg or prd"
        required: true
        type: string

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One upload at a time per app and environment; a newer run replaces one still waiting.
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    # The environment holds the deployment token (AZURE_SWA_TOKEN_<KEY>) and the URL variables.
    # 'prd' also requires the owner's approval before this job starts.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars[format('{0}_URL', inputs.key)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* values are baked into the files at build time, so each environment builds on its own.
      # Search engines may index only when the app's *_SITE_ENV variable in 'prd' is exactly 'prd';
      # staging, and any other value (for example 'hold'), builds with noindex.
      - run: pnpm turbo run build --filter=@manziltech/${{ inputs.app }}
        env:
          NEXT_PUBLIC_SITE_ENV: ${{ inputs.environment == 'prd' && vars[format('{0}_SITE_ENV', inputs.key)] || 'stg' }}
          NEXT_PUBLIC_HUB_URL: ${{ vars.HUB_URL }}
          NEXT_PUBLIC_HAJJANDUMRAH_URL: ${{ vars.HAJJANDUMRAH_URL }}
          NEXT_PUBLIC_BOOKINGS_URL: ${{ vars.BOOKINGS_URL }}
          NEXT_PUBLIC_STUDIO_URL: ${{ vars.STUDIO_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # Upload only: the files are already built above.
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('AZURE_SWA_TOKEN_{0}', inputs.key)] }}
          action: upload
          app_location: apps/${{ inputs.app }}/out
          skip_app_build: true
          skip_api_build: true
