name: .NET

on:
  push:
    branches: [master]
    paths: &paths
      - "src/**"
      - "tests/**"
      - "ManzilTech.slnx"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".editorconfig"
      - ".config/dotnet-tools.json"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Restore also runs the NuGet vulnerability audit; warnings are errors.
      - run: dotnet restore ManzilTech.slnx

      - run: dotnet build ManzilTech.slnx -c Release --no-restore

      - run: dotnet test --solution ManzilTech.slnx -c Release --no-build
