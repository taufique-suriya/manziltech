name: Deploy bookings (stg)

# Builds the bookings app as static files and uploads them to the Azure Static Web App
# 'swa-manziltech-bookings-stg' (decision 0009). Runs on every merge to master that touches the bookings app.
on:
  push:
    branches: [master]
    paths:
      - "apps/bookings/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/workflows/deploy-bookings-stg.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer merge waits instead of cancelling an upload halfway.
concurrency:
  group: deploy-bookings-stg
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub environment 'stg' holds the deployment token and the URL variables.
    environment:
      name: stg
      url: ${{ vars.BOOKINGS_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@manziltech/bookings
        env:
          NEXT_PUBLIC_SITE_ENV: stg
          NEXT_PUBLIC_HUB_URL: ${{ vars.HUB_URL }}

      # Upload only: the files are already built above.
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_BOOKINGS }}
          action: upload
          app_location: apps/bookings/out
          skip_app_build: true
          skip_api_build: true
