packages:
  - apps/*
  - packages/*
  - src

# Only install package versions that have been public for at least a day
# (protects against freshly published malicious releases).
minimumReleaseAge: 1440

# Shared versions: packages use "catalog:" instead of a version number.
catalog:
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.4.2
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.71.2
